name: Build SoundTube APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SoundTube
        uses: actions/checkout@v4
        with:
          ref: ai-studio-import-core-ready

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build SoundTube debug APK
        run: |
          ./gradlew :androidApp:assembleDebug \
            --no-daemon \
            --no-build-cache \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC" \
            -Dorg.gradle.workers.max=2

      - name: Upload SoundTube APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundTube-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
